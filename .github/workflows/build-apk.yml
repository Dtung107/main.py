
name: Build Android APK for Pydroid 3 Web

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Không dùng cache: 'npm' vì repo không có package-lock.json
      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7/8 yêu cầu Java 21
      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: 5. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 6. Install Capacitor Core & Android Tools
        run: npm install --save-dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: 7. Build Web Assets
        run: npm run build

      - name: 8. Initialize & Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: 9. Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: 10. Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 12. Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: Pydroid 3 Web Android APK v1.0.0
          body: Tải tệp app-debug.apk bên dưới và cài trực tiếp trên điện thoại Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
